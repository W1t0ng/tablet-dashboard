<!DOCTYPE html>

<html>

<head>

    <title>Tablet Dashboard</title>

    <link rel="stylesheet" href="style.css">

    <script src="app.js"></script>

</head>

<body>
    <div id="home">
        

        <h1>Tablet Dashboard</h1>
    
        <button onclick="showScreen('dashboard')">
            Dashboard
        </button>
    
        <button onclick="showScreen('weather')">
            Weather
        </button>
    
        <button onclick="showScreen('tube')">
            Tube
        </button>
    
        <button onclick="showScreen('spotify')">
            Spotify
        </button>
    
        <button onclick="showScreen('radar')">
            Sky Radar
        </button>

    </div>

    <div id="dashboard" class="screen">
        <h1>Dashboard</h1>
        <p>Dashboard content goes here.</p>
    </div>

     <div id="weather" class="screen">
        <h1>Weather</h1>
        <p>Weather content goes here.</p>
    </div>

     <div id="tube" class="screen">
        <h1>Tube</h1>
        <p>Tube content goes here.</p>
    </div>

     <div id="spotify" class="screen">
        <h1>Spotify</h1>
        <p>Spotify content goes here.</p>
    </div>

     <div id="radar" class="screen">
        <h1>Sky Radar</h1>
        <p>Aircraft content goes here.</p>
    </div>

    
    

</body>

</html>
