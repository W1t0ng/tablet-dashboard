<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"

          content="width=device-width, initial-scale=1.0">

    <title>Tablet Dashboard</title>

    <link rel="stylesheet" href="style.css">

    <script src="app.js" defer></script>

    <script src="weather.js" defer></script>

    tube.jsscript>

    spotify.jsscript>

    radar.jsscript>

</head>

<body>

    <div id="home">

        <h1>Tablet Dashboard</h1>

        <button onclick="showScreen('dashboard')">

            Dashboard

        </button>

        <button onclick="showScreen('weather')">

            Weather

        </button>

        <button onclick="showScreen('tube')">

            Tube

        </button>

        <button onclick="showScreen('spotify')">

            Spotify

        </button>

        <button onclick="showScreen('radar')">

            Sky Radar

        </button>

    </div>

    <div id="dashboard" class="screen">

        <h1>Dashboard</h1>

        <button onclick="goHome()">

            Home

        </button>

        <div id="dashboard-content">

            <p>Loading dashboard...</p>

        </div>

    </div>

    <div id="weather" class="screen">

        <h1>Weather</h1>

        <button onclick="goHome()">

            Home

        </button>

        <div id="weather-content">

            <p>Loading weather...</p>

        </div>

    </div>

    <div id="tube" class="screen">

        <h1>Tube</h1>

        <button onclick="goHome()">

            Home

        </button>

        <div id="tube-content">

            <p>Loading tube data...</p>

        </div>

    </div>

    <div id="spotify" class="screen">

        <h1>Spotify</h1>

        <button onclick="goHome()">

            Home

        </button>

        <div id="spotify-content">

            <p>Loading Spotify...</p>

        </div>

    </div>

    <div id="radar" class="screen">

        <h1>Sky Radar</h1>

        <button onclick="goHome()">

            Home

        </button>

        <div id="radar-content">

            <p>Loading aircraft...</p>

        </div>

    </div>

</body>

</html>
