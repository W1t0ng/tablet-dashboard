<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tablet Dashboard</title>

    <link rel="stylesheet" href="style.css">

    <script src="app.js" defer></script>

    <script src="weather.js" defer></script>

    <script src="tube.js" defer></script>

</head>

<body>

    <div id="home">

        <h1>Tablet Dashboard</h1>

        <button onclick="showScreen('dashboard')">

            Dashboard

        </button>

        <button onclick="showScreen('weather')">

            Weather

        </button>

        <button onclick="showScreen('tube')">

            Tube

        </button>

    </div>

    <div id="dashboard" class="screen">

        <h1>Dashboard</h1>

        <button class="home-btn"

                onclick="goHome()">

            Home

        </button>

        <div id="dashboard-content">

            Dashboard Ready

        </div>

    </div>

    <div id="weather" class="screen">

        <h1>Weather</h1>

        <button class="home-btn"

                onclick="goHome()">

            Home

        </button>

        <div id="weather-content">

            Loading Weather...

        </div>

    </div>

    <div id="tube" class="screen">

        <h1>Tube</h1>

        <button class="home-btn"

                onclick="goHome()">

            Home

        </button>

        <div id="tube-content">

            Loading Tube Data...

        </div>

    </div>

</body>

</html>
